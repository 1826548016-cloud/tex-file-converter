<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ doc.title }} - 分享预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F7F6F3; color: #2F3437; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: #fff; border-bottom: 1px solid #EAEAEA;
  }
  .title { font-size: 15px; font-weight: 600; }
  .meta { font-size: 12px; color: #787774; font-family: ui-monospace, monospace; }
  main { flex: 1; position: relative; }
  iframe { width: 100%; height: 100%; border: none; background: #fff; }
</style>
</head>
<body>
  <header>
    <span class="title">{{ doc.title }}</span>
    <span class="meta">由 TeX → PDF 生成</span>
  </header>
  <main>
    <iframe src="{{ pdf_url }}" title="PDF 预览"></iframe>
  </main>
</body>
</html>
